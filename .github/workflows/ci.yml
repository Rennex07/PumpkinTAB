name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The Pumpkin revision whose `pumpkin-plugin-api` this is built against.
  #
  # This is a release TAG, not `master`, and that matters. The marketplace serves
  # the published release, so the component has to be built against the WIT in
  # that release. Upstream `master` has a different WIT — commit 5746077df
  # (#3568) added an AI event to `event.wit` — and a component built against it
  # fails to load on the release with a bare
  # "type-checking export func 'handle-event'" and no explanation.
  #
  # `nightly` shares the release's WIT, so this build also covers nightly.
  #
  # Bump PUMPKIN_REF, PUMPKIN_DIR and WIT_TREE together. The patch path in the
  # root Cargo.toml is `../Pumpkin`, so PUMPKIN_DIR has to match it or the build
  # silently resolves nothing.
  PUMPKIN_REPO: Pumpkin-MC/Pumpkin
  PUMPKIN_REF: 0.2.0+26.3-26.51
  PUMPKIN_DIR: Pumpkin
  # The tree hash of crates/pumpkin-plugin-wit/v0.1 at PUMPKIN_REF. This is the
  # only thing that actually decides whether a component loads: Pumpkin kept the
  # `0.2.0+26.3-26.51` version string across a WIT change, so a server and a
  # component can both report the same version and still disagree.
  WIT_TREE: e0bb97ea48d9857c181356ba14964d47b20d0f56

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Cloned rather than checked out with `path:`, because that input nests the
      # repository *inside* the workspace, and the `[patch.crates-io]` in the root
      # Cargo.toml points at a sibling of the workspace.
      - name: Clone the plugin API the component is built against
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) $env:PUMPKIN_DIR
          git clone --depth 1 --branch $env:PUMPKIN_REF "https://github.com/$env:PUMPKIN_REPO" $dest
          "Cloned $env:PUMPKIN_REPO@$env:PUMPKIN_REF into $dest at $(git -C $dest rev-parse HEAD)"

      # The compatibility check, made explicit. A drifting WIT is the one failure
      # that a green build does not catch, because the component still compiles.
      - name: Verify the plugin WIT matches the pinned tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) $env:PUMPKIN_DIR
          $actual = git -C $dest rev-parse 'HEAD:crates/pumpkin-plugin-wit/v0.1'
          "WIT tree: $actual"
          "expected: $env:WIT_TREE"
          if ($actual -ne $env:WIT_TREE) {
            throw "the plugin WIT at $env:PUMPKIN_REF is $actual, not $env:WIT_TREE. A component built against it will not load on a server from that tag; update PUMPKIN_REF and WIT_TREE deliberately, not automatically."
          }

      - name: Install the wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: >-
            PumpkinTAB -> target
            ${{ env.PUMPKIN_DIR }} -> target

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release --target wasm32-wasip2

      - name: Upload the component
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-tab
          path: target/wasm32-wasip2/release/pumpkin_tab.wasm
