name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The plugin WIT that the component is built against.
  #
  # The `pumpkin-plugin-api` crate is resolved from crates.io, so the build
  # needs no sibling checkout of Pumpkin and anyone can build this plugin
  # without one. What still has to be checked is that the published crate
  # carries the WIT of the release the server runs.
  #
  # This is a release, not `master`, and that matters. Upstream `master` has a
  # different WIT - commit 5746077df (#3568) added an AI event to `event.wit` -
  # and a component built against it fails to load on the release with a bare
  # "type-checking export func 'handle-event'" and no explanation.
  #
  # The version string cannot be used to check that either: Pumpkin kept the
  # `0.2.0+26.3-26.51` version string across a WIT change, so a server and a
  # component can both report the same version and still disagree.
  #
  # Bump the `pumpkin-plugin-api` requirement in the manifests and WIT_TREE
  # together. `tools/check-wit.ps1` reads the version from the requirement, so
  # there is only one place to bump the version.
  #
  # The tree hash of crates/pumpkin-plugin-wit/v0.1 in the matching Pumpkin
  # release. This is the only thing that actually decides whether a component
  # loads.
  WIT_TREE: e0bb97ea48d9857c181356ba14964d47b20d0f56

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # The compatibility check, made explicit. A drifting WIT is the one failure
      # that a green build does not catch, because the component still compiles.
      - name: Verify the plugin WIT matches the pinned tree
        shell: pwsh
        run: tools/check-wit.ps1

      - name: Install the wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: PumpkinTAB -> target

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release --target wasm32-wasip2

      - name: Upload the component
        uses: actions/upload-artifact@v4
        with:
          name: pumpkin-tab
          path: target/wasm32-wasip2/release/pumpkin_tab.wasm
