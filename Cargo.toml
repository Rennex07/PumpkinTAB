[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# The plugin reports this through `CARGO_PKG_VERSION`, so it has to track the
# release tag. Keep the two in step when cutting a release.
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-only"
authors = ["Rennex"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# A maintained fork of the archived `serde_yaml`, same API, and it compiles for
# `wasm32-wasip2` where a dependency on libc would not.
serde_norway = "0.9"
tracing = "0.1"

# A plugin is a component, not a native library, so the size of the artifact is
# the thing worth trading build speed for.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
